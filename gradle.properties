# Настройки JVM для Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 0.24.0: AGP 9.4.1 приносит built-in Kotlin, но он НЕ поддерживает компилятор-плагины
# (kotlin-compose, kotlin-serialization). Escape-hatch возвращает внешний KGP
# (org.jetbrains.kotlin.android 2.3.21); флаг удалят в AGP 10 — переезд на built-in
# + альтернативные плагины будет отдельной задачей.
android.builtInKotlin=false

# INFRA-9 (0.11.0): кэши сборки — повторные сборки/CI идут заметно быстрее
org.gradle.caching=true
# Configuration cache: конфигурация не пересчитывается на каждый invocation.
# Проблемы не роняют сборку (warn) — включали консервативно.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# -Werror сознательно НЕ включён (решение, INFRA-9): предупреждения KSP/Compose-генераторов
# не должны ломать релизную сборку; наш код проверяется lint-гейтом CI.
