# Настройки JVM для Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# INFRA-9 (0.11.0): кэши сборки — повторные сборки/CI идут заметно быстрее
org.gradle.caching=true
# Configuration cache: конфигурация не пересчитывается на каждый invocation.
# Проблемы не роняют сборку (warn) — включали консервативно.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# -Werror сознательно НЕ включён (решение, INFRA-9): предупреждения KSP/Compose-генераторов
# не должны ломать релизную сборку; наш код проверяется lint-гейтом CI.
