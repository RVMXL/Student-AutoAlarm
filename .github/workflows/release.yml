name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег, например v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: "0. Тег и версия"
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "✗ тег '$TAG' не vX.Y.Z"; exit 1 ;; esac
          echo "TAG=$TAG"     >> "$GITHUB_ENV"
          echo "VER=${TAG#v}" >> "$GITHUB_ENV"

      # SEC-5 (0.10.0): actions запинены по SHA релизного коммита (мутабельные теги — supply-chain риск)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ── ГЕЙТ: релиз не уедет при незаполненных версии/заметках/тестах ──
      - name: "1. Гейт: версия в gradle равна тегу, заметки и CHANGELOG на месте"
        run: |
          set -euo pipefail
          GV=$(grep -oP 'versionName\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)
          echo "versionName=$GV, тег=$VER"
          test "$GV" = "$VER" || { echo "✗ версия в app/build.gradle.kts ($GV) != тегу ($VER) — бампни и переправь тег"; exit 1; }
          test -f "RELEASE-$VER.md" || { echo "✗ нет RELEASE-$VER.md — заметки релиза обязательны"; exit 1; }
          grep -q "## \[$VER\]" CHANGELOG.md || { echo "✗ в CHANGELOG.md нет секции [$VER]"; exit 1; }

      - name: "2. Unit-тесты"
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # ── КЛЮЧ ПОДПИСИ: только из Secrets, SHA-пин, автогенерация запрещена ──
      # Обновления поверх старых установок возможны ТОЛЬКО с неизменным ключом,
      # поэтому новый ключ никогда не создаётся молча: нет секрета — падаем.
      - name: "3. Ключ подписи из Secrets + сверка SHA-256 пина"
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_SHA256: 78ed80919d0d4b3fd51663ae97c9cd3bc0609183b2a9faa9acd66c42ee88e90d
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "✗ секреты подписи не заданы: KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            echo "  (Settings → Secrets and variables → Actions. Ключ НИКОГДА не генерируем заново:"
            echo "   новый ключ = невозможно обновиться поверх старой установки.)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          ACTUAL=$(sha256sum "$RUNNER_TEMP/release.keystore" | cut -d' ' -f1)
          echo "SHA-256 ключа из секрета: $ACTUAL"
          echo "SHA-256 мастер-пина:      $KEYSTORE_SHA256"
          if [ "$ACTUAL" != "$KEYSTORE_SHA256" ]; then
            echo "✗ SHA-256 ключа НЕ совпал с мастер-пином: секрет подменён или испорчен."
            echo "  Сборка остановлена — подписываем только проверенный стабильный ключ."
            exit 1
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      # ── СБОРКА ──
      - name: "4. Сборка подписанного APK (R8 + shrinkResources)"
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: "5. Проверка подписи APK (сертификат должен совпадать со стабильным)"
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "✗ APK не собран"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          CERT_SHA=$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/certs.txt | head -1)
          echo "Сертификат подписи (SHA-256): $CERT_SHA"
          echo "CERT_SHA=$CERT_SHA" >> "$GITHUB_ENV"

      - name: "5b. Сверка versionCode/versionName в APK с тегом"
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          BADGING=$("$AAPT" dump badging "$APK")
          VC=$(echo "$BADGING" | grep -oP "versionCode='\K[0-9]+")
          VN=$(echo "$BADGING" | grep -oP "versionName='\K[0-9]+\.[0-9]+\.[0-9]+")
          echo "в APK: versionCode=$VC, versionName=$VN (тег: $TAG)"
          test "$VN" = "$VER" || { echo "✗ versionName в APK ($VN) != тегу ($VER)"; exit 1; }
          EXP=$((10#$(echo "$VER" | cut -d. -f1) * 10000 + 10#$(echo "$VER" | cut -d. -f2) * 100 + 10#$(echo "$VER" | cut -d. -f3)))
          test "$VC" = "$EXP" || { echo "✗ versionCode в APK ($VC) != ожидаемого ($EXP)"; exit 1; }

      - name: "6. Артефакты → download/ с версией в имени"
        run: |
          set -euo pipefail
          mkdir -p download
          cp app/build/outputs/apk/release/app-release.apk "download/Student-AutoAlarm-$VER-android.apk"
          ls -la download/

      # ── ПУБЛИКАЦИЯ ──
      - name: "7. Заметки: RELEASE-$VER.md + SHA-таблица + сертификат"
        run: |
          set -euo pipefail
          {
            cat "RELEASE-$VER.md"
            echo
            echo "## Артефакты (SHA-256, собрано CI для тега $TAG)"
            echo
            echo "| Файл | SHA-256 |"
            echo "|---|---|"
            (cd download && sha256sum * | awk '{print "| `" $2 "` | `" $1 "` |"}')
            echo
            echo "## Подпись"
            echo
            echo "Сертификат подписи (SHA-256): \`$CERT_SHA\` — один и тот же для всех релизов;"
            echo "это гарантирует установку обновлений поверх предыдущих версий без удаления данных."
          } > /tmp/notes.md
          echo "--- заметки ---"
          cat /tmp/notes.md

      - name: "8. Prerelease + ассеты (идемпотентно, перезапись при дожиме)"
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VER (prerelease)" --notes-file /tmp/notes.md --prerelease
          else
            gh release create "$TAG" --prerelease --title "$VER (prerelease)" --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" download/* --clobber

      - name: "9. Итог: контроль числа ассетов"
        run: |
          set -euo pipefail
          N=$(gh release view "$TAG" --json assets -q '.assets | length')
          echo "ассетов: $N"
          test "$N" -eq 1
