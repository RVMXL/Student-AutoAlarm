name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # запись результатов в Code Scanning
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # декларации workflow-ов — анализ без сборки
          - language: actions
            build-mode: none
          # 0.19.0: ручной режим вместо autobuild — автосборка CodeQL
          # стабильно падала на Gradle-конфигурации проекта (не знает про
          # Android SDK); официальный путь — manual + явные шаги сборки
          - language: java-kotlin
            build-mode: manual
    steps:
      # SEC-5: actions запинены по SHA (мутабельные теги — supply-chain риск)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: "Сборка для анализа (debug)"
        if: matrix.language == 'java-kotlin'
        # scheduled-ран 2026-10-19 упал exit 32 («didn't build any of it»):
        # kotlinc по умолчанию живёт в отдельном Kotlin-daemon JVM, который
        # стартует вне перехвата экстрактора CodeQL (гонка — push-раны ловили,
        # scheduled — нет). Стратегия in-process прижимает компиляцию к JVM
        # Gradle с агентом экстрактора; clean страхует от up-to-date задач.
        run: ./gradlew --no-daemon -Dkotlin.compiler.execution.strategy=in-process clean :app:assembleDebug

      - uses: github/codeql-action/analyze@ce5e7eeac396d720fe2d802714996c8ce561e311 # v3.39.0
        with:
          category: "/language:${{ matrix.language }}"
