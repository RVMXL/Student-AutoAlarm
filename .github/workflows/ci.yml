name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      # SEC-5 (0.10.0): actions запинены по SHA релизного коммита (мутабельные теги — supply-chain риск)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: "Гейт: версия в gradle согласована с CHANGELOG"
        run: |
          set -euo pipefail
          GV=$(grep -oP 'versionName\s*=\s*"\K[0-9]+\.[0-9]+\.[0-9]+' app/build.gradle.kts | head -1)
          echo "versionName=$GV"
          test -n "$GV" || { echo "✗ не нашёл versionName в app/build.gradle.kts"; exit 1; }
          grep -q "## \[$GV\]" CHANGELOG.md || { echo "✗ в CHANGELOG.md нет секции [$GV]"; exit 1; }

      - name: "Компиляция debug и unit-тесты"
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
