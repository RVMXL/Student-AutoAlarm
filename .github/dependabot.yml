# INFRA-2 (0.10.0): фаза 1 подъёма toolchain — автоматические PR об обновлениях.
# Майорные прыжки AGP/Kotlin/BOM делаем поэтапно и осознанно; Dependabot готовит
# кандидатов, решение о мерже — за человеком/агентом после полного прогона CI.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    # Враппер зафиксирован на 9.5.1: AGP 8.x несовместим с Gradle ≥9.6
    # (внутренний API InternalProblems удалён в 9.6.0 — конфигурация падает).
    # Игнор до миграции на AGP 9 (отдельная задача, см. CHANGELOG 0.24.0).
    ignore:
      - dependency-name: "gradle"
        versions: [">=9.6"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
