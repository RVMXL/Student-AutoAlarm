# INFRA-2 (0.10.0): фаза 1 подъёма toolchain — автоматические PR об обновлениях.
# Майорные прыжки AGP/Kotlin/BOM делаем поэтапно и осознанно; Dependabot готовит
# кандидатов, решение о мерже — за человеком/агентом после полного прогона CI.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
    # Связку AGP-Gradle проверяет CI (0.24.0: AGP 9.4.1 + Gradle 9.8.1).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
